spring.application.name=SWP391_BE
server.port=8080

# MySQL: database se tu dong duoc tao neu chua co (createDatabaseIfNotExist=true)
# Moi nguoi dat bien moi truong DB_USERNAME / DB_PASSWORD neu tai khoan MySQL tren may khac mac dinh ben duoi
spring.datasource.url=jdbc:mysql://localhost:3306/swp391_group3?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
jwt.expiration=86400000

# Dia chi Front-End duoc phep goi API (nhieu dia chi thi ngan cach bang dau phay)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@example.com}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── VNPay Sandbox (T5.5) ──────────────────────────────────────────────────────
# Thay bang gia tri sandbox that tu VNPay Developer Portal
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMO1234}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMOSECRET1234567890ABCDEFGHIJKL}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/vnpay/callback}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/vnpay/ipn}
vnpay.api-version=2.1.0
vnpay.command=pay
vnpay.currency-code=VND
vnpay.locale=vn
