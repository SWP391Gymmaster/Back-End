spring.application.name=SWP391_BE
server.port=8080

# SQL Server: moi nguoi co the dat bien moi truong DB_USERNAME / DB_PASSWORD
# neu mat khau "sa" tren may khac voi mac dinh ben duoi
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=swp391_group3;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
jwt.expiration=86400000

# Dia chi Front-End duoc phep goi API (nhieu dia chi thi ngan cach bang dau phay)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
